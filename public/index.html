<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <header>
        <div class="title">
            <h1>F I L M S</h1>
            <div class="circle"></div>
        </div>
    </header>
    <main>
        <div class="search-section">
            <input type="text" placeholder="Buscar filmes...">
            <button id="search-button">Pesquisar</button>
        </div>
        <div class="filter-section">
            <select id="filter-select">
                <option value="popular">Filmes Populares</option>
                <option value="top_rated">Melhor Avaliados</option>
                <option value="release_date_desc">Mais Recentes</option>
                <option value="release_date_asc">Mais Antigos</option>
                <option value="vote_average">Maior Nota</option>
            </select>
        </div>
        <p class="catalog-title" id="catalog-title">Filmes Populares</p>
        <div class="card-section">
    </main>
</body>
<script src="assets/app.js"></script>
</html>
